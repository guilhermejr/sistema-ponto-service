services:
  ponto-service:
    image: guilhermejr/sistema-ponto-service
    container_name: ponto-service
    restart: always
    env_file: /home/guilhermejr/secrets/ponto-service.env
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:9012:9012"

networks:
  default:
    external: true
    name: rede
